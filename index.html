<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Canvas & Code — A blog about engineering, design, and the craft of building things with warmth and intention." />
    <!-- keywords is replaced per-route by vite-plugin-prerender at build time -->
    <meta name="keywords" content="Canvas & Code, blog, web development, frontend, design, React, engineering, 博客, 前端, 设计" />
    <!-- Tell Baidu the site renders well on both desktop and mobile -->
    <meta name="applicable-device" content="pc,mobile" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="alternate" type="application/rss+xml" title="Canvas & Code RSS" href="/feed.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Canvas &amp; Code</title>
  </head>
  <body>
    <script>
      // Prevent FOUC: apply theme before React loads
      (function() {
        var stored = localStorage.getItem("blog-theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (stored === "dark" || (!stored && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
